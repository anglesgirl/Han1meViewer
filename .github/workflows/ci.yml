permissions:
  contents: read
  actions: read
name: CI

on:
  push:
    branches: [ "main", "clean-ech" ]
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    inputs:
      apk_upload_id:
        description: 'Resume a 24-hour Oracle upload session for the exact same APK SHA-256'
        required: false
        type: string
      apk_source_run_id:
        description: 'Original GitHub Actions run ID containing the APK artifact'
        required: false
        type: string

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Load Google Services File
        env:
          DATA: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo $DATA | base64 -di > app/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV

      - name: Set up keystore for signing
        run: |
          mkdir -p $HOME/.android
          mv keystore.jks $HOME/.android/keystore.jks

      - name: Build and sign APK with Gradle
        run: ./gradlew assembleRelease
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          HA_GITHUB_TOKEN: ${{ secrets.HA_GITHUB_TOKEN }}
          HA1_VERSION_SOURCE: 'ci'

      - name: Archive APK for resumable upload
        id: apk_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.sha }}
          path: app/build/outputs/apk/release/Han1meViewer-v*.apk
          if-no-files-found: error



      - name: Submit clean-ech APK to Oracle smoke test
        id: oracle_smoke
        if: github.ref == 'refs/heads/clean-ech'
        env:
          APK_TEST_API_TOKEN: ${{ secrets.APK_TEST_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.APK_TEST_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.APK_TEST_CF_ACCESS_CLIENT_SECRET }}
          APK_UPLOAD_ID: ${{ github.event.inputs.apk_upload_id }}
          APK_SOURCE_RUN_ID: ${{ github.event.inputs.apk_source_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/oracle-apk-smoke.sh

      - name: Upload Oracle smoke-test evidence
        if: always() && github.ref == 'refs/heads/clean-ech'
        uses: actions/upload-artifact@v4
        with:
          name: oracle-smoke-${{ github.sha }}
          path: ${{ runner.temp }}/apk-test-evidence
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail the build if Oracle smoke test did not pass
        if: always() && github.ref == 'refs/heads/clean-ech'
        env:
          ORACLE_TEST_RESULT: ${{ steps.oracle_smoke.outputs.result }}
        run: |
          if [[ "$ORACLE_TEST_RESULT" != 'passed' ]]; then
            echo "::error::Oracle smoke test result: ${ORACLE_TEST_RESULT:-missing}"
            exit 1
          fi
