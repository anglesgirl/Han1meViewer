permissions:
  contents: write
name: CI

on:
  push:
    # 我们的 ECH 分支也要出包（上游只监听 main；我们以 misaka/main 为基准做开发）
    branches: [ "main", "ech-conscrypt" ]
    paths-ignore:
      - "**.md"
  # 手动触发（改 secret / 重出包时不用空提交）
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要 tag/history 才能生成"自上一个构建以来的变更"列表
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify WebView ECH bridge JS
        # 传输桥的 JS 断言（语法 + 接管逻辑）。放在编译前跑：JS 写坏了是静默失效，最难查
        run: bash .github/scripts/verify-ech-bridge-js.sh

      - name: Decode keystore
        # ⚠️ 上游用的是 YOUR_KEYSTORE_BASE64，本 fork 的 secret 叫 KEYSTORE_BASE64
        # （fallback 保留上游名字，两边都能用）
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.KEYSTORE_BASE64 || secrets.YOUR_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::缺少 keystore secret（KEYSTORE_BASE64）"
            exit 1
          fi
          printf '%s' "$KS" | base64 -d > keystore.jks
          ls -lh keystore.jks

      - name: Load Google Services File
        # Firebase 配置走 secret（.gitignore 里明确排除该文件，不进 git）
        env:
          DATA: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$DATA" ]; then
            echo "::error::缺少 secret GOOGLE_SERVICES_JSON_BASE64（Firebase 配置）"
            exit 1
          fi
          printf '%s' "$DATA" | base64 -d > app/google-services.json
          python3 - <<'PY'
          import json
          d = json.load(open('app/google-services.json'))
          pkgs = [c['client_info']['android_client_info']['package_name'] for c in d.get('client', [])]
          print('google-services.json 合法 ✓ 包名:', pkgs)
          assert 'com.yenaly.han1meviewer.ech' in pkgs, '包名与 applicationId 不匹配，processReleaseGoogleServices 会失败'
          PY

      - name: Set up keystore for signing
        run: |
          mkdir -p $HOME/.android
          mv keystore.jks $HOME/.android/keystore.jks

      - name: Build and sign APK with Gradle
        run: ./gradlew assembleRelease
        env:
          # 同上：兼容本 fork 的 secret 命名
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD != '' && secrets.KEYSTORE_PASSWORD || secrets.YOUR_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD != '' && secrets.KEYSTORE_PASSWORD || secrets.YOUR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          # ⚠️ 故意不注入 HA_GITHUB_TOKEN：CI 的临时 token 编进包里早就过期，
          # App 带着它请求 GitHub 会 401（公开仓库匿名请求反而正常）→ 更新检查会静默失效。
          HA1_VERSION_SOURCE: 'ci'

      - name: Verify APK (Conscrypt ECH, arm64, 无 Go 残留)
        # CI 绿灯 ≠ 功能可用；这里至少证明「打进去的是 Conscrypt 而不是 Go 反代」
        run: |
          set -e
          APK=$(find app/build/outputs/apk -name "Han1meViewer-v*.apk" -type f | head -1)
          echo "APK: $APK"
          [ -n "$APK" ] || { echo "::error::没有找到 release APK"; exit 1; }
          du -h "$APK"
          unzip -l "$APK" | grep -E "lib/arm64-v8a/" || true
          # Go 反代时代的产物不该再出现
          if unzip -l "$APK" | grep -q "libgojni.so"; then
            echo "::error::APK 里还有 Go 代理的 libgojni.so"; exit 1
          fi
          # Conscrypt 的 native 库必须在
          unzip -l "$APK" | grep -q "libconscrypt_jni.so" || {
            echo "::error::APK 里没有 libconscrypt_jni.so（Conscrypt 没打进去）"; exit 1; }
          echo "Conscrypt ECH 校验通过 ✓"

      - name: Upload APK Zip
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.sha }}
          path: app/build/outputs/apk/release/Han1meViewer-v*.apk

      - name: Publish to GitHub Release
        # CI 出的包一律发成「预发布」：
        #   · 稳定通道（App 默认读 releases/latest）只认正式版 → 用户不会被自动推到每次构建
        #   · 设置里的「CI 更新频道」读 releases 列表（含预发布）→ 这才是它"更快但不保证稳定"的语义
        # tag 直接用 APK 名（**不要加分支后缀**）：App 端要从 tag 里取出 `+<版本号>` 判断要不要更新
        if: success() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          APK=$(find app/build/outputs/apk -name "Han1meViewer-v*.apk" -type f | head -1)
          [ -n "$APK" ] || { echo "::error::没有找到 release APK"; exit 1; }
          SIZE_MB=$(du -m "$APK" | cut -f1)
          APK_NAME=$(basename "$APK")
          TAG="$(basename "$APK" .apk)"
          echo "Publishing ${SIZE_MB}MB $APK as $TAG"
          ACCEL1="https://gh-proxy.com/https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${APK_NAME}"
          ACCEL2="https://ghfast.top/https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${APK_NAME}"
          DIRECT="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${APK_NAME}"
          PREV=$(git describe --tags --abbrev=0 --match 'Han1meViewer-*' 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            CHANGELOG=$(git log --pretty=format:'- %s' "${PREV}..HEAD" | head -40)
          else
            CHANGELOG=$(git log --pretty=format:'- %s' -20)
          fi
          {
            echo "arm64-only APK (${SIZE_MB}MB) — misaka 基座 + Conscrypt in-process ECH。"
            echo ""
            echo "## 本次变更"
            echo "${CHANGELOG}"
            echo ""
            echo "## 大陆加速下载"
            echo "- gh-proxy: ${ACCEL1}"
            echo "- ghfast: ${ACCEL2}"
            echo ""
            echo "直连: ${DIRECT}"
          } > /tmp/release_notes.md
          NOTES=$(cat /tmp/release_notes.md)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "$NOTES" >/dev/null 2>&1 || true
          else
            gh release create "$TAG" "$APK" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Han1meViewer (Conscrypt ECH) ${TAG}" \
              --notes "$NOTES" \
              --prerelease
          fi
          echo "RELEASE_TAG=$TAG"
          # 预发布只留最近 5 个（正式版不动），别把 release 列表堆爆
          gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease) | .tagName' | tail -n +6 | while read -r t; do
              if [ -n "$t" ]; then gh release delete "$t" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true; fi
            done

      - name: Notify build result
        # 无论成败都要回传（用户明确要求：CI 成败都通知，附上产物下载入口）
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          BUILD_STATUS: ${{ job.status }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash .github/scripts/notify-build-result.sh
