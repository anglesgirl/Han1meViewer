permissions:
  contents: read
name: CI

on:
  push:
    branches: [ "main", "clean-ech" ]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Load Google Services File
        env:
          DATA: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo $DATA | base64 -di > app/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        run: |
          echo "${{ secrets.YOUR_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks || true
          # 如果 secret 损坏则现场生成一个（clean-ech 测试分支用）
          if ! keytool -list -keystore keystore.jks -storepass "${{ secrets.YOUR_KEYSTORE_PASSWORD }}" >/dev/null 2>&1; then
            echo "Keystore invalid, generating a fresh one for CI"
            rm -f keystore.jks
            keytool -genkeypair -v -keystore keystore.jks -alias "${{ secrets.KEY_ALIAS }}" -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "${{ secrets.YOUR_KEYSTORE_PASSWORD }}" \
              -keypass "${{ secrets.YOUR_KEYSTORE_PASSWORD }}" \
              -dname "CN=Han1meViewer, OU=CI, O=CI, L=CI, ST=CI, C=CN"
          fi

      - name: Set up keystore for signing
        run: |
          mkdir -p $HOME/.android
          mv keystore.jks $HOME/.android/keystore.jks

      - name: Build and sign APK with Gradle
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.YOUR_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.YOUR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          HA_GITHUB_TOKEN: ${{ secrets.HA_GITHUB_TOKEN }}
          HA1_VERSION_SOURCE: 'ci'

      - name: Upload APK Zip
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.sha }}
          path: app/build/outputs/apk/release/Han1meViewer-v*.apk
