permissions:
  contents: read
name: CI

on:
  push:
    # 我们的 ECH 分支也要出包（上游只监听 main；我们以 misaka/main 为基准做开发）
    branches: [ "main", "ech-conscrypt" ]
    paths-ignore:
      - "**.md"

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        # ⚠️ 上游用的是 YOUR_KEYSTORE_BASE64，本 fork 的 secret 叫 KEYSTORE_BASE64
        # （fallback 保留上游名字，两边都能用）
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.KEYSTORE_BASE64 || secrets.YOUR_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::缺少 keystore secret（KEYSTORE_BASE64）"
            exit 1
          fi
          printf '%s' "$KS" | base64 -d > keystore.jks
          ls -lh keystore.jks

      - name: Set up keystore for signing
        run: |
          mkdir -p $HOME/.android
          mv keystore.jks $HOME/.android/keystore.jks

      - name: Build and sign APK with Gradle
        run: ./gradlew assembleRelease
        env:
          # 同上：兼容本 fork 的 secret 命名
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD != '' && secrets.KEYSTORE_PASSWORD || secrets.YOUR_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD != '' && secrets.KEYSTORE_PASSWORD || secrets.YOUR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          # 上游用自定义 PAT；本 fork 未设置时回落到内置 token（仅用于版本查询）
          HA_GITHUB_TOKEN: ${{ secrets.HA_GITHUB_TOKEN != '' && secrets.HA_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          HA1_VERSION_SOURCE: 'ci'

      - name: Upload APK Zip
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.sha }}
          path: app/build/outputs/apk/release/Han1meViewer-v*.apk

      - name: Notify build result
        # 无论成败都要回传（用户明确要求：CI 成败都通知，附上产物下载入口）
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          BUILD_STATUS: ${{ job.status }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash .github/scripts/notify-build-result.sh
