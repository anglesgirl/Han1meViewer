permissions:
  contents: read
name: CI

on:
  push:
    branches: [ "main", "experiment/**" ]
    paths-ignore:
      - "**.md"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build ECH proxy AAR (gomobile, arm64)
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          cd ech
          go get golang.org/x/mobile/bind@latest
          mkdir -p ../app/libs
          gomobile bind -v -target=android/arm64 -androidapi 29 \
            -o ../app/libs/echproxy.aar ./echproxy
          ls -la ../app/libs

      - name: Build
        run: ./gradlew buildDebug -x lint
