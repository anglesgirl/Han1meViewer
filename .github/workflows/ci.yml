permissions:
  contents: read
name: CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew buildDebug -x lint

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: han1meviewer-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
