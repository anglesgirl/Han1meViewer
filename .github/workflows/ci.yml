permissions:
  contents: read
name: CI

on:
  push:
    branches: [ "main", "diagnostics-foundation" ]
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    inputs:
      version_source:
        description: "HA1_VERSION_SOURCE"
        default: "release"
        required: false

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          mkdir -p ~/.android
          echo "$KEYSTORE_BASE64" | base64 -d > ~/.android/keystore.jks
          ls -lh ~/.android/keystore.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build APK
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "Gradle build attempt ${attempt}/3"
            if [ -n "$KEYSTORE_BASE64" ]; then
              echo "Building RELEASE with fixed signature"
              ./gradlew assembleRelease -x lint
            else
              ./gradlew assembleDebug -x lint
            fi
            status=$?
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle failed, retrying after dependency/network timeout..."
              sleep 15
            fi
          done
          exit "$status"
        env:
          HA_GITHUB_TOKEN: ''
          HA1_VERSION_SOURCE: ${{ inputs.version_source || 'ci' }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: Upload APK Zip
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/Han1meViewer-v*.apk
            app/build/outputs/apk/debug/Han1meViewer-v*.apk
