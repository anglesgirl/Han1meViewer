permissions:
  contents: read
name: CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build ECH proxy AAR (gomobile, arm64)
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          cd ech
          # Add x/mobile as a module dependency (required by gomobile bind).
          go get golang.org/x/mobile/bind@latest
          mkdir -p ../app/libs
          gomobile bind -v -target=android/arm64 -androidapi 29 \
            -o ../app/libs/echproxy.aar ./echproxy
          ls -la ../app/libs

      - name: Build
        run: ./gradlew assembleDebug -x lint

      - name: Verify ECH library in APK
        run: |
          APK=$(find app/build/outputs -name "*.apk" -type f | head -1)
          echo "APK: $APK"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libgojni.so" && echo "libgojni.so present ✓" || echo "WARNING: libgojni.so missing"

      - name: Find APK
        run: find app/build/outputs -name "*.apk" -type f

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: han1meviewer-debug
          path: app/build/outputs/apk/debug/
          retention-days: 7
